<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="planGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(239, 85%, 67%)" />
      <stop offset="100%" stop-color="hsl(243, 100%, 82%)" />
    </linearGradient>
    <linearGradient id="planAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(142, 71%, 45%)" />
      <stop offset="100%" stop-color="hsl(39, 95%, 62%)" />
    </linearGradient>
  </defs>

  <!-- Main container circle -->
  <circle cx="24" cy="24" r="20" fill="url(#planGradient)" />

  <!-- Inner geometric pattern representing task organization -->
  <g transform="translate(24, 24)">
    <!-- Central organizing point -->
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.9" />

    <!-- Task/plan lines radiating out -->
    <g stroke="white" stroke-width="2" opacity="0.8" stroke-linecap="round">
      <line x1="0" y1="-12" x2="0" y2="-8" />
      <line x1="8.5" y1="-8.5" x2="6" y2="-6" />
      <line x1="12" y1="0" x2="8" y2="0" />
      <line x1="8.5" y1="8.5" x2="6" y2="6" />
      <line x1="0" y1="12" x2="0" y2="8" />
      <line x1="-8.5" y1="8.5" x2="-6" y2="6" />
      <line x1="-12" y1="0" x2="-8" y2="0" />
      <line x1="-8.5" y1="-8.5" x2="-6" y2="-6" />
    </g>

    <!-- Small accent dots -->
    <circle cx="0" cy="-10" r="1.5" fill="url(#planAccent)" />
    <circle cx="7" cy="-7" r="1.5" fill="url(#planAccent)" />
    <circle cx="10" cy="0" r="1.5" fill="url(#planAccent)" />
    <circle cx="7" cy="7" r="1.5" fill="url(#planAccent)" />
  </g>
</svg>
